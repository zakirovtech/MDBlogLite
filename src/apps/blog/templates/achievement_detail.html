{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h4 mb-1">{{ ach.header }}</h1>
        <div class="meta">
          <i class="bi bi-calendar me-1"></i>{{ ach.date_created|date:"d M Y" }} {{ ach.date_created|time:"H:i" }}
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'achievements-list' %}">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
        {% if request.user.is_authenticated %}
          <a class="btn btn-outline-secondary btn-sm" href="{{ ach.get_update_url }}">
            <i class="bi bi-pencil me-1"></i>Edit
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="{{ ach.get_delete_url }}">
            <i class="bi bi-trash me-1"></i>Delete
          </a>
        {% endif %}
      </div>
    </div>

    {% if ach.image %}
      <div class="mb-3">
        <img src="{{ ach.image.url }}" class="img-thumbnail" alt="Achievement image">
      </div>
    {% endif %}

    <div class="prose">
      {{ ach.body|linebreaksbr }}
    </div>
  </div>
</div>
{% endblock content %}
