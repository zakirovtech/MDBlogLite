{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h1 class="h5 mb-2">Download PDF</h1>
    <div class="meta mb-3">Are you sure you want to download your bio as PDF?</div>

    <form method="post" action="{% url 'bio-download' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-secondary btn-sm">
        Confirm download
      </button>
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'bio' %}">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock content %}
