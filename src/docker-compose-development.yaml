version: '3.7'

name: MDBlogLite
services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    image: mdblog_dev
    container_name: blog_dev
    env_file:
      - ./env/.env
    depends_on:
      - cache
    ports:
      - 8003:8000
    volumes:
      - ./:/usr/app/src/
    restart: always
    command: "bash ./scripts/entrypoint.sh"

  cache:
    image: redis:latest
    container_name: cache_dev
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    env_file:
      - ./env/.env
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  celery_worker:
    restart: always
    build: .
    image: celery_worker_dev
    container_name: celery_worker_dev
    volumes:
      - ./:/usr/app/src
    env_file:
      - ./env/.env
    depends_on:
      - cache
      - web
    command: 'celery -A config worker -l info'
